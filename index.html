<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- normaliz -->
    <link rel="stylesheet" href="css/normalize.css" />
    <!-- font awsome -->
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/rules.css" />
    <!-- main css -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- google fonts -->
    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap"
      rel="stylesheet"
    />
    <title>CRUD</title>
  </head>

  <body>
    <div class="container">
      <div class="heading">
        <section class="title-count-section">
          <h3 class="title">all products :</h3>
          <span class="count-products">result</span>
        </section>
        <hr />
        <section class="search-add-section">
          <form class="search">
            <input
              type="search"
              class="search-input"
              placeholder="search for products"
            />
          </form>
          <button class="btn-add">+ add product</button>
        </section>
      </div>
      <section class="table-products">
        <table>
          <thead>
            <tr>
              <th>product</th>
              <th>category</th>
              <th>Price</th>
              <th>stock</th>
              <th colspan="4" class="update prodect">last update</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
      <!-- card-add -->
      <div class="card-pop">
        <h3 class="title">add product</h3>
        <button class="btn-close">x</button>
        <hr />
        <div class="info">
          <div class="name">
            <label>Name</label>
            <input type="text" id="name" placeholder="type product name" />
          </div>
          <div class="stock">
            <label>stock</label>
            <input type="number" id="stock" placeholder=" product stock" />
          </div>
          <div class="price">
            <label>price</label>
            <input type="number" id="price" placeholder="$158" />
          </div>
          <div class="Category" id="Category">
            <label>Category</label><br />
            <select class="categorys">
              <option>Ipad</option>
              <option>Mac</option>
              <option>Mobile</option>
              <option>laptop</option>
            </select>
          </div>
        </div>
        <div class="description">
          <label>description</label><br />
          <textarea
            class="description"
            placeholder="Write product description here"
          >
          </textarea>
        </div>
        <button class="btn-add-submit">+ add new product</button>
      </div>
      <!-- card-edit -->
      <section class="card-edit">
        <h3 class="title">edit product</h3>
        <button class="btn-close">x</button>
        <hr />
        <div class="info">
          <div class="name">
            <label>Name</label>
            <input type="text" id="name-edit" placeholder="type product name" />
          </div>
          <div class="stock">
            <label>stock</label>
            <input type="number" id="stock-edit" placeholder=" product stock" />
          </div>
          <div class="price">
            <label>price</label>
            <input type="number" id="price-edit" placeholder="$158" />
          </div>
          <div class="Category" id="Category-edit">
            <label>Category</label><br />
            <select class="categorys">
              <option>Ipad</option>
              <option>Mac</option>
              <option>Mobile</option>
              <option>laptop</option>
            </select>
          </div>
        </div>
        <div class="description">
          <label>description</label><br />
          <textarea
            class="description"
            placeholder="Write product description here"
          >
          </textarea>
        </div>
        <button class="btn-edit-submit">confirm</button>
      </section>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
